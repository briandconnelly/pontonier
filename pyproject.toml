[project]
name = "pontonier"
version = "0.7.0"
description = "Shared core library for cross-model agent-bridge MCP servers (codex-in-claude, moonbridge, claude-in-codex)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Brian Connelly" },
]
keywords = ["agent-bridge", "mcp", "claude-code", "codex", "kimi", "worktree", "jobs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
# Every layer of the package depends only on anyio. backend/conventions are plain
# dataclasses, and pontonier.testing imports no test framework — adding a runtime
# dependency here changes the contract for all three bridges, so it needs a reason
# in the changelog, not just a convenient import.
dependencies = [
    "anyio>=4",
]

[project.urls]
Homepage = "https://github.com/briandconnelly/pontonier"
Repository = "https://github.com/briandconnelly/pontonier"
Issues = "https://github.com/briandconnelly/pontonier/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pontonier"]

[dependency-groups]
dev = [
    "import-linter>=2",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7",
    "ruff>=0.15.15",
    "ty>=0.0.1a7",
]

[tool.ruff]
line-length = 100
# Matches requires-python (>=3.11).
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PIE", "RUF", "PL", "PT", "TID", "TC", "ARG", "PTH"]
ignore = [
    "PLR0913",  # too-many-args: policy/config objects legitimately take many params
    "PLR0917",  # too-many-positional-args: same
    "PLR0911",  # too-many-returns: classify/dispatch helpers branch per case
    "PLR0912",  # too-many-branches: same
    "PLR2004",  # magic-value: noisy for literals
]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts, fixtures-as-args, private access, inline literals, broad
# raises, and comma-string parametrize names by design.
"tests/**" = ["ARG", "PLR2004", "S101", "TC001", "TC002", "TC003", "PT006", "PT011", "PT018", "PLC0415", "RUF059", "SLF001"]

[tool.ty.src]
include = ["src"]

[tool.ty.rules]
unresolved-import = "warn"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=pontonier --cov-report=term-missing --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/pontonier"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.importlinter]
root_package = "pontonier"

# The one-way rule: pontonier.core must not import from the rest of pontonier.
# This is what keeps core reusable by every consumer regardless of which
# backend/conventions pieces they adopt.
[[tool.importlinter.contracts]]
name = "core is a leaf layer"
type = "forbidden"
source_modules = ["pontonier.core"]
forbidden_modules = ["pontonier.backend", "pontonier.conventions", "pontonier.testing"]
